# Prometheus configuration for the docker-compose demo stack.
#
#   docker compose up -d
#   open http://localhost:9090

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: hardening-agent-demo

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # The agent's own HTTP exporter. Serves a cached audit, so a 15s scrape
  # interval costs nothing even though the audit itself takes far longer.
  - job_name: hardening-agent
    static_configs:
      - targets: ["agent:9101"]
        labels:
          service: hardening-agent
    metrics_path: /metrics
    # Generous relative to the scrape interval: the exporter answers from cache
    # in milliseconds, but a loaded host can still be slow to schedule it.
    scrape_timeout: 10s

  # The same compliance metrics arriving via the textfile collector, which is
  # how you would run this on a host that already has node_exporter. Both paths
  # are scraped here purely to demonstrate them side by side -- in production
  # you would pick one.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# In a real deployment, replace the static configs above with service discovery:
